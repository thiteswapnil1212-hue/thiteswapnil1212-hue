<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 200" font-family="Inter,-apple-system,'Segoe UI',sans-serif">
  <defs>
    <linearGradient id="hbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7C3AED"><animate attributeName="offset" values="-.2;.2;1.2" dur="6s" repeatCount="indefinite"/></stop>
      <stop offset=".55" stop-color="#0B64D4"><animate attributeName="offset" values="0;.55;1.5" dur="6s" repeatCount="indefinite"/></stop>
      <stop offset="1" stop-color="#0d1117"><animate attributeName="offset" values=".4;1;1.9" dur="6s" repeatCount="indefinite"/></stop>
    </linearGradient>
    <linearGradient id="hwave1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7C3AED" stop-opacity=".55"/>
      <stop offset="1" stop-color="#06B6D4" stop-opacity=".55"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="1000" height="200" fill="url(#hbg)"/>
  <g fill="#ffffff" opacity=".7">
    <circle cx="90" cy="42" r="3"><animate attributeName="opacity" values=".7;.15;.7" dur="2.4s" repeatCount="indefinite"/></circle>
    <circle cx="910" cy="52" r="3"><animate attributeName="opacity" values=".15;.7;.15" dur="2.4s" begin=".8s" repeatCount="indefinite"/></circle>
    <circle cx="840" cy="30" r="2"><animate attributeName="opacity" values=".7;.2;.7" dur="2s" begin=".4s" repeatCount="indefinite"/></circle>
    <circle cx="150" cy="30" r="2"><animate attributeName="opacity" values=".2;.7;.2" dur="2s" begin="1s" repeatCount="indefinite"/></circle>
  </g>
  <text x="500" y="86" text-anchor="middle" font-size="54" font-weight="800" fill="#ffffff" letter-spacing="1">Swapnil Thite</text>
  <text x="500" y="122" text-anchor="middle" font-size="18" fill="#dbe4ff">AI &amp; Data Science Student  ·  Building AI-Powered Web Apps</text>
  <g opacity=".5">
    <animateTransform attributeName="transform" type="translate" values="0 0;-1000 0" dur="14s" repeatCount="indefinite"/>
    <path d="M0,150 C125,120 250,180 375,150 C500,120 625,180 750,150 C875,120 1000,180 1125,150 C1250,120 1375,180 1500,150 C1625,120 1750,180 1875,150 C2000,120 2000,120 2000,150 L2000,200 L0,200 Z" fill="url(#hwave1)"/>
  </g>
