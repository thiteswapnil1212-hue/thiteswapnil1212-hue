    <animateTransform attributeName="transform" type="translate" values="-1000 0;0 0" dur="18s" repeatCount="indefinite"/>
    <path d="M0,168 C125,140 250,190 375,168 C500,140 625,190 750,168 C875,140 1000,190 1125,168 C1250,140 1375,190 1500,168 C1625,140 1750,190 1875,168 C2000,140 2000,140 2000,168 L2000,200 L0,200 Z" fill="#06B6D4"/>
