<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 110" font-family="Inter,-apple-system,'Segoe UI',sans-serif">
  <defs>
    <linearGradient id="egrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7C3AED"><animate attributeName="offset" values="-.3;.3;1.3" dur="4s" repeatCount="indefinite"/></stop>
      <stop offset=".5" stop-color="#06B6D4"><animate attributeName="offset" values="0;.5;1.5" dur="4s" repeatCount="indefinite"/></stop>
      <stop offset="1" stop-color="#7C3AED"><animate attributeName="offset" values=".3;.8;1.8" dur="4s" repeatCount="indefinite"/></stop>
    </linearGradient>
  </defs>
  <rect x="2" y="2" width="996" height="106" rx="18" fill="#0d1117" stroke="url(#egrad)" stroke-width="2"/>
  <g fill="#7C3AED">
    <circle cx="70" cy="55" r="5"><animate attributeName="cy" values="55;38;55" dur="2.2s" repeatCount="indefinite"/><animate attributeName="opacity" values="1;.4;1" dur="2.2s" repeatCount="indefinite"/></circle>
    <circle cx="930" cy="55" r="5" fill="#06B6D4"><animate attributeName="cy" values="55;72;55" dur="2.2s" begin=".6s" repeatCount="indefinite"/><animate attributeName="opacity" values="1;.4;1" dur="2.2s" begin=".6s" repeatCount="indefinite"/></circle>
    <circle cx="120" cy="80" r="3" fill="#06B6D4"><animate attributeName="cy" values="80;66;80" dur="1.8s" begin=".3s" repeatCount="indefinite"/></circle>
    <circle cx="880" cy="30" r="3"><animate attributeName="cy" values="30;44;30" dur="1.8s" begin=".9s" repeatCount="indefinite"/></circle>
  </g>
  <text x="500" y="48" text-anchor="middle" font-size="24" font-weight="800" fill="url(#egrad)" letter-spacing="2">SHIPPING REAL PRODUCTS, NOT JUST TUTORIALS</text>
  <text x="500" y="80" text-anchor="middle" font-size="15" fill="#8b949e">SkillGrid &#183; ANVIX AI &#183; Mauli Interior &#183; Nirman Drushti &#8212; all live on Vercel</text>
  <circle cx="500" cy="97" r="3" fill="#22d3ee"><animate attributeName="opacity" values="1;0;1" dur="1.4s" repeatCount="indefinite"/></circle>
</svg>
